# Inori Collection を GitHub Pages に公開するワークフロー
#
# 使い方（最初に1回だけ）：
#   リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
#
# main ブランチに push するたびに、テスト → ビルド → 公開 を自動で行います。
# テストが1件でも失敗した場合は公開しません（公開中のアプリはそのまま残ります）。
#
# アプリのファイル（package.json）は、リポジトリの直下・inori-collection フォルダーの
# どちらに置いても動きます（自動で判別します）。
#
# 公開する版の切り替え（v1.2.0〜）：
#   リポジトリの Settings → Secrets and variables → Actions → Variables に
#   INORI_EDITION = public を追加すると「公開版」（ジャケット画像を配信元から取得しない版）を公開します。
#   未設定（または personal）なら、これまでどおり「個人用版」を公開します。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開処理は同時に1つだけ。実行中の公開は中断しない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Locate the app folder
        id: app
        run: |
          if [ -f package.json ]; then
            dir=.
          elif [ -f inori-collection/package.json ]; then
            dir=inori-collection
          else
            echo "::error::package.json が見つかりません（リポジトリ直下か inori-collection フォルダーに置いてください）"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "アプリのフォルダー: $dir"

      # ブラウザからのアップロードでファイルが足りないと、分かりにくいエラーになるため先に確認する
      - name: Check the app files
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          missing=0
          for f in index.html package.json package-lock.json tsconfig.json vite.config.ts \
                   src/main.tsx src/App.tsx src/edition.ts src/data/releases.ts src/data/jackets.ts src/data/jackets.public.ts \
                   src/lib/backup.ts src/lib/offline.ts src/lib/userJackets.ts src/lib/imageProcess.ts \
                   src/components/Jacket.tsx src/components/DetailSheet.tsx public/favicon.svg public/icons/icon-192.png public/icons/icon-512.png \
                   tests/data.test.ts tests/backup.test.ts tests/fixtures/backup-v1.0.0-34forms.zip; do
            if [ ! -f "$f" ]; then
              echo "::error::ファイルが見つかりません: ${{ steps.app.outputs.dir }}/$f"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::アプリのファイルが足りません。アプリ一式（src・tests・public フォルダーなどすべて）をアップロードしてください"
            exit 1
          fi
          echo "アプリのファイル一式を確認しました（$(find src tests public -type f | wc -l) ファイル）"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.app.outputs.dir }}/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm ci

      - name: Unit tests
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm test

      - name: Build
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          # 例：https://<ユーザー名>.github.io/inori-collection/ → /inori-collection/
          #     独自ドメインで公開している場合 → /
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # personal（個人用版・既定）または public（公開版）
          INORI_EDITION: ${{ vars.INORI_EDITION || 'personal' }}
        run: |
          echo "公開パス: $BASE_PATH"
          echo "公開する版: $INORI_EDITION"
          npm run build

      # 公開パスに合わせたビルドになっているかを確認する（合っていないと真っ白な画面になるため、その場合は公開しない）
      - name: Check the build
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          if ! grep -q "src=\"${BASE_PATH}assets/" dist/index.html; then
            echo "::error::ビルド結果が公開パス ${BASE_PATH} に合っていません。${{ steps.app.outputs.dir }} フォルダーのファイルが v1.1.1 以降か確認してください（vite.config.ts・package.json など）"
            exit 1
          fi
          if ! grep -q "\"start_url\":\"${BASE_PATH}\"" dist/manifest.webmanifest; then
            echo "::error::manifest.webmanifest の start_url が公開パス ${BASE_PATH} になっていません"
            exit 1
          fi
          echo "公開パス ${BASE_PATH} に合ったビルドです（バージョン $(node -p "require('./package.json').version")）"

      # 公開版には画像のURLが1つも含まれていないことを確認する（含まれていたら公開しない）
      - name: Check the public edition
        if: ${{ vars.INORI_EDITION == 'public' }}
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          if grep -rlE "/img/goods/|wp-content/uploads|/img/disco/" dist; then
            echo "::error::公開版のビルドにジャケット画像のURLが含まれています（上のファイル）。公開を中止しました"
            exit 1
          fi
          echo "公開版：ジャケット画像のURLは含まれていません"

      - name: Upload the built app
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.app.outputs.dir }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
